<app-page-header title="Units" subtitle="Units of measure used by inventory items and purchases">
  <button *appHasPermission="'inventory.create'" type="button" class="btn btn-primary" (click)="openCreate()">
    <i class="bi bi-plus-lg me-1"></i>Add Unit
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [items]="items()"
  [total]="total()"
  [loading]="loading()"
  [error]="error()"
  [page]="query.page ?? 1"
  [pageSize]="query.pageSize ?? 20"
  searchPlaceholder="Search code or name..."
  emptyTitle="No units found"
  (queryChange)="onQuery($event)"
  (retry)="load()"
>
  <ng-template appRowActions let-row>
    <button *appHasPermission="'inventory.update'" type="button" class="btn btn-sm btn-outline-secondary me-1" (click)="openEdit(row)">
      <i class="bi bi-pencil"></i> Edit
    </button>
    <button
      *appHasPermission="'inventory.update'"
      type="button"
      class="btn btn-sm"
      [class.btn-outline-danger]="row.isActive"
      [class.btn-outline-success]="!row.isActive"
      (click)="toggleActive(row)"
    >
      {{ row.isActive ? 'Deactivate' : 'Activate' }}
    </button>
  </ng-template>
</app-data-table>

<app-modal [open]="modalOpen()" [title]="editing() ? 'Edit Unit' : 'Add Unit'" (closed)="closeModal()">
  <form id="unitForm" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <app-form-field label="Code" inputId="unitCode" [control]="form.controls.code" hint="Short code, e.g. LTR, KG">
      <input id="unitCode" type="text" class="form-control" formControlName="code" maxlength="20" autocomplete="off" />
    </app-form-field>
    <app-form-field label="Name" inputId="unitName" [control]="form.controls.name">
      <input id="unitName" type="text" class="form-control" formControlName="name" maxlength="100" autocomplete="off" />
    </app-form-field>
    @if (editing()) {
      <div class="form-check form-switch">
        <input id="unitActive" type="checkbox" class="form-check-input" formControlName="isActive" />
        <label class="form-check-label" for="unitActive">Active</label>
      </div>
    }
  </form>
  <div modal-footer>
    <button type="button" class="btn btn-light" (click)="closeModal()">Cancel</button>
    <button type="submit" form="unitForm" class="btn btn-primary" [disabled]="saving()">
      @if (saving()) {
        <span class="spinner-border spinner-border-sm me-1"></span>
      }
      Save
    </button>
  </div>
</app-modal>
