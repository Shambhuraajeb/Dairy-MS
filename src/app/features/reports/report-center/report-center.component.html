<app-page-header title="Report Center" subtitle="Pick a report, set filters, run it, then export to CSV or print" />

<div class="card mb-3">
  <div class="card-body py-2">
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input
        #q
        type="search"
        class="form-control"
        placeholder="Search reports by name or category..."
        [value]="search()"
        (input)="search.set(q.value)"
      />
    </div>
  </div>
</div>

@if (loading()) {
  <app-loading text="Loading reports..." />
} @else if (error()) {
  <div class="alert alert-danger d-flex align-items-center justify-content-between">
    <span>{{ error() }}</span>
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="load()">Retry</button>
  </div>
} @else {
  @for (g of groups(); track g.name) {
    <h2 class="section-title"><i class="bi {{ g.icon }} me-1"></i>{{ g.name }}</h2>
    <div class="row g-3 mb-4">
      @for (r of g.items; track r.code) {
        <div class="col-12 col-md-6 col-xl-4">
          <a class="card report-card h-100 text-decoration-none" [routerLink]="['/reports', r.code]">
            <div class="card-body d-flex gap-3">
              <span class="report-icon"><i class="bi {{ r.icon }}"></i></span>
              <div>
                <div class="fw-semibold">{{ r.name }}</div>
                <div class="text-muted small">{{ r.description }}</div>
              </div>
            </div>
          </a>
        </div>
      }
    </div>
  } @empty {
    <app-empty-state icon="bi-search" title="No reports found" message="Try a different search term." />
  }
}
