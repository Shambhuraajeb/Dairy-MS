<app-page-header title="Milk Tanks" subtitle="Chilling and storage tanks: fill level, temperature and movements">
  <a class="btn btn-outline-secondary" routerLink="/collection"><i class="bi bi-grid me-1"></i>Shift dashboard</a>
  <button *appHasPermission="'collection.create'" type="button" class="btn btn-primary" (click)="openCreate()">
    <i class="bi bi-plus-lg me-1"></i>Add Tank
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [items]="items()"
  [total]="total()"
  [loading]="loading()"
  [error]="error()"
  [page]="query.page ?? 1"
  [pageSize]="query.pageSize ?? 20"
  searchPlaceholder="Search tank code or name..."
  emptyTitle="No tanks found"
  (queryChange)="onQuery($event)"
  (retry)="load()"
>
  <div tableFilters class="d-flex flex-wrap gap-2 align-items-center">
    <select class="form-select form-select-sm w-auto" aria-label="Center" (change)="onFilter('centerId', $event)">
      <option value="" [selected]="!query['centerId']">All centers</option>
      @for (c of centers(); track c.id) {
        <option [value]="c.id" [selected]="query['centerId'] === c.id">{{ c.name }}</option>
      }
    </select>
    <select class="form-select form-select-sm w-auto" aria-label="Status" (change)="onFilter('status', $event)">
      <option value="" [selected]="!query['status']">All statuses</option>
      @for (s of statuses; track s) {
        <option [value]="s" [selected]="query['status'] === s">{{ s }}</option>
      }
    </select>
  </div>

  <ng-template appColumn="fillPercent" let-row>
    <div class="d-flex align-items-center gap-2" style="min-width: 120px">
      <div class="progress flex-grow-1" style="height: 8px">
        <div class="progress-bar" [class]="fillClass(row.fillPercent)" [style.width.%]="row.fillPercent"></div>
      </div>
      <span class="small text-muted">{{ row.fillPercent | appNumber: 0 }}%</span>
    </div>
  </ng-template>
  <ng-template appColumn="milkType" let-row>{{ row.milkType ?? 'Any' }}</ng-template>
  <ng-template appColumn="currentTemperature" let-row>
    @if (row.currentTemperature !== null) {
      <span
        [class.text-danger]="(row.maxTemperature !== null && row.currentTemperature > row.maxTemperature) || (row.minTemperature !== null && row.currentTemperature < row.minTemperature)"
      >{{ row.currentTemperature | appNumber: 1 }}</span>
    } @else {
      <span class="text-muted">—</span>
    }
  </ng-template>
  <ng-template appRowActions let-row>
    <button type="button" class="btn btn-sm btn-outline-secondary me-1" (click)="txnTank.set(row)">
      <i class="bi bi-arrow-left-right"></i> Movements
    </button>
    <button *appHasPermission="'collection.update'" type="button" class="btn btn-sm btn-outline-secondary" (click)="openEdit(row)">
      <i class="bi bi-pencil"></i> Edit
    </button>
  </ng-template>
</app-data-table>

<app-tank-transactions-modal [tank]="txnTank()" (closed)="txnTank.set(null)" (changed)="load()" />

<app-modal [open]="modalOpen()" [title]="editing() ? 'Edit Tank' : 'Add Tank'" size="lg" (closed)="closeModal()">
  <form id="tankForm" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="row">
      <div class="col-md-4">
        <app-form-field label="Code" inputId="tankCode" [control]="form.controls.code">
          <input id="tankCode" type="text" maxlength="30" class="form-control" formControlName="code" autocomplete="off" />
        </app-form-field>
      </div>
      <div class="col-md-8">
        <app-form-field label="Name" inputId="tankName" [control]="form.controls.name">
          <input id="tankName" type="text" maxlength="100" class="form-control" formControlName="name" autocomplete="off" />
        </app-form-field>
      </div>
      <div class="col-md-6">
        <app-form-field label="Collection center" inputId="tankCenter" [control]="form.controls.collectionCenterId">
          <select id="tankCenter" class="form-select" formControlName="collectionCenterId">
            <option [ngValue]="null">Select center</option>
            @for (c of centers(); track c.id) {
              <option [ngValue]="c.id">{{ c.name }}</option>
            }
          </select>
        </app-form-field>
      </div>
      <div class="col-md-3">
        <app-form-field
          label="Capacity (L)"
          inputId="tankCap"
          [control]="form.controls.capacityLiters"
          [hint]="editing() ? 'Not below current quantity' : ''"
        >
          <input id="tankCap" type="number" step="0.001" class="form-control" formControlName="capacityLiters" />
        </app-form-field>
      </div>
      <div class="col-md-3">
        <app-form-field label="Milk type" inputId="tankMilk">
          <select id="tankMilk" class="form-select" formControlName="milkType">
            <option value="">Any</option>
            @for (m of milkTypes; track m) {
              <option [value]="m">{{ m }}</option>
            }
          </select>
        </app-form-field>
      </div>
      <div class="col-md-4">
        <app-form-field label="Min temperature (°C)" inputId="tankMin">
          <input id="tankMin" type="number" step="0.1" class="form-control" formControlName="minTemperature" />
        </app-form-field>
      </div>
      <div class="col-md-4">
        <app-form-field label="Max temperature (°C)" inputId="tankMax">
          <input id="tankMax" type="number" step="0.1" class="form-control" formControlName="maxTemperature" />
        </app-form-field>
      </div>
      <div class="col-md-4">
        <app-form-field label="Current temperature (°C)" inputId="tankCur">
          <input id="tankCur" type="number" step="0.1" class="form-control" formControlName="currentTemperature" />
        </app-form-field>
      </div>
      @if (editing()) {
        <div class="col-md-4">
          <app-form-field label="Status" inputId="tankStatus">
            <select id="tankStatus" class="form-select" formControlName="status">
              @for (s of statuses; track s) {
                <option [value]="s">{{ s }}</option>
              }
            </select>
          </app-form-field>
        </div>
        <div class="col-md-4">
          <app-form-field label="Last cleaned" inputId="tankCleaned">
            <input id="tankCleaned" type="date" class="form-control" formControlName="lastCleanedDate" />
          </app-form-field>
        </div>
        <div class="col-md-4 d-flex align-items-center">
          <div class="form-check form-switch">
            <input id="tankActive" type="checkbox" class="form-check-input" formControlName="isActive" />
            <label class="form-check-label" for="tankActive">Active</label>
          </div>
        </div>
      }
    </div>
  </form>
  <div modal-footer>
    <button type="button" class="btn btn-light" (click)="closeModal()">Cancel</button>
    <button type="submit" form="tankForm" class="btn btn-primary" [disabled]="saving()">
      @if (saving()) {
        <span class="spinner-border spinner-border-sm me-1"></span>
      }
      Save
    </button>
  </div>
</app-modal>
